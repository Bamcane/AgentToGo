<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆管理 - AgentToGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex flex-col h-screen">
        <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/" class="text-blue-400 hover:text-blue-300">← 返回</a>
                <h1 class="text-xl font-bold text-blue-400">AgentToGo - 记忆管理</h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="notification-btn" class="relative p-2 hover:bg-gray-700 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                    <span id="notification-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">记忆管理</h2>
                    <button id="add-memory-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">
                        + 添加记忆
                    </button>
                </div>
                <div id="memory-list" class="space-y-3">
                </div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div id="modal-content" class="bg-gray-800 rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        </div>
    </div>

    <div id="notification-panel" class="hidden fixed right-0 top-0 h-full w-96 bg-gray-800 border-l border-gray-700 shadow-xl z-40 overflow-y-auto">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <h3 class="text-lg font-bold">通知</h3>
            <button id="mark-all-read" class="text-sm text-blue-400 hover:text-blue-300">全部已读</button>
        </div>
        <div id="notification-list" class="p-4 space-y-3">
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/notifications.js"></script>
    <script src="/static/js/memory.js"></script>
</body>
</html>
